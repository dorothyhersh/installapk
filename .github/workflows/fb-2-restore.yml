name: FB 2 - Restore backup from Mega (runner IP only)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name"
        required: false
        type: string
        default: "com.facebook.katana"
      resave:
        description: "Re-upload a refreshed backup after a successful restore"
        required: false
        type: boolean
        default: false
      reel_count:
        description: "How many reels to download and post (0 = skip reel posting)"
        required: false
        type: string
        default: "3"
      reels_src_folder:
        description: "Mega folder to pull reel videos from"
        required: false
        type: string
        default: "FB_Reels"
      reels_done_folder:
        description: "Mega folder posted reels are moved to (prevents re-posting)"
        required: false
        type: string
        default: "FB_Reels2"
      reencode_reels:
        description: "Re-encode videos to emulator-friendly H.264/AAC before posting (1 = yes, 0 = no)"
        required: false
        type: string
        default: "1"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Tailscale step here on purpose: restore uses the plain GitHub runner IP.

      # Installed BEFORE the emulator starts so a flaky download cannot waste the emulator boot.
      - name: Install rclone (official build with Mega backend)
        run: |
          ok=0
          for url in \
            "https://downloads.rclone.org/rclone-current-linux-amd64.zip" \
            "https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip" \
            "https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip"; do
            for i in 1 2 3; do
              rm -rf /tmp/rclone-dl && mkdir -p /tmp/rclone-dl
              if curl -fSL --retry 3 --connect-timeout 20 --max-time 180 -o /tmp/rclone-dl/rclone.zip "$url" \
                 && unzip -q -o /tmp/rclone-dl/rclone.zip -d /tmp/rclone-dl; then
                ok=1; break 2
              fi
              echo "rclone download failed ($url, attempt $i)"; sleep 4
            done
          done
          [ "$ok" = "1" ] || { echo "ERROR: could not download rclone"; exit 1; }
          sudo install -m 0755 "$(find /tmp/rclone-dl -type f -name rclone | head -1)" /usr/local/bin/rclone
          rclone version | head -1
          rclone help backends | grep -i mega

      # Used to re-encode reel videos so the emulator's software decoder can play them.
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator, download backup from Mega, restore and verify
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: restore
          PACKAGE_NAME: ${{ inputs.package_name }}
          RESAVE: ${{ inputs.resave && '1' || '0' }}
          APK_MEGA_FILE: facebook-apk/facebook.zip
          FB_PAGE_NAME: ${{ secrets.FB_PAGE_NAME }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_FILE: fb-session.tgz.enc
          REEL_COUNT: ${{ inputs.reel_count }}
          MEGA_REELS_SRC: ${{ inputs.reels_src_folder }}
          MEGA_REELS_DONE: ${{ inputs.reels_done_folder }}
          REENCODE_REELS: ${{ inputs.reencode_reels }}
          MAX_PLAYBACK_FAILS: "2"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            echo "[$(date -u +%T)] emulator is installed and fully booted"
            adb devices -l
            echo "[$(date -u +%T)] public IP (runner, no exit node): $(curl -s --max-time 30 https://ifconfig.me)"
            echo "[$(date -u +%T)] restoring backup and launching Facebook"
            bash scripts/facebook-install-and-login.sh
            echo "[$(date -u +%T)] ALL DONE"

      - name: Print all logs
        if: always()
        run: |
          echo "=== public IP now ==="; curl -s --max-time 20 https://ifconfig.me || true; echo
          echo "=== run.log ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log (script never started)"
          echo "=== artifacts ==="; ls -la artifacts/ 2>/dev/null || echo "no artifacts folder"
          echo "=== logcat (last 200 lines) ==="; tail -n 200 artifacts/logcat.txt 2>/dev/null || echo "no logcat"

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-restore-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
