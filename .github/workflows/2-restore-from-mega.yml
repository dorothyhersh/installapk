name: 2 - Restore from Mega

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK (same version as the backup)"
        required: true
        type: string
        default: "https://github.com/bluesky-social/social-app/releases/download/1.136.0/Bluesky-1.136.0.apk"
      package_name:
        description: "Package name (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      backup_file:
        description: "File in the Mega folder to restore (default = latest)"
        required: false
        type: string
        default: "session.tgz.enc"
      resave:
        description: "Upload a fresh backup to Mega after a successful restore"
        required: false
        type: boolean
        default: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install chafa (screenshot preview in logs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chafa

      - name: Download from Mega and restore
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: restore
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          RESAVE: ${{ inputs.resave && '1' || '0' }}
          MEGA_DOWNLOAD: "1"
          MEGA_UPLOAD: "1"
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: bluesky-android-backup
          MEGA_FILE: ${{ inputs.backup_file }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash scripts/install-and-screenshot.sh

      - name: Upload screenshots and logs
        id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show artifact link
        if: always()
        run: |
          echo "Screenshots: ${{ steps.upload.outputs.artifact-url }}"
          {
            echo "### Restore screenshots"
            echo "[Download restore-screenshots](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"