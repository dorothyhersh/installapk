name: 2 - Restore from Mega

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK (same version as the backup)"
        required: true
        type: string
        default: "https://github.com/bluesky-social/social-app/releases/download/1.136.0/Bluesky-1.136.0.apk"
      package_name:
        description: "Package name (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      backup_file:
        description: "File in the Mega folder to restore (default = latest)"
        required: false
        type: string
        default: "session.tgz.enc"
      explore:
        description: "After restore: search the hashtag, scan posts, open a recent popular post and its likers"
        required: false
        type: boolean
        default: true
      hashtag:
        description: "Hashtag to search"
        required: false
        type: string
        default: "#foodie"
      results_tab:
        description: "Results tab to scan"
        required: false
        type: choice
        options:
          - Top
          - Latest
        default: Top
      max_age_hours:
        description: "Only posts not older than this many hours (1d counts as 24h; use 23 to exclude 1d)"
        required: false
        type: string
        default: "24"
      min_likes:
        description: "Only posts with MORE likes than this"
        required: false
        type: string
        default: "30"
      fresh_hours:
        description: "A qualifying post this young (hours) is opened immediately"
        required: false
        type: string
        default: "6"
      scan_screens:
        description: "How many screens to scroll while scanning"
        required: false
        type: string
        default: "20"
      follow_enabled:
        description: "Follow people from the post's Liked by list and save them to .xlsx (needs explore)"
        required: false
        type: boolean
        default: true
      follow_count:
        description: "How many of the likers to follow"
        required: false
        type: string
        default: "15"
      follow_account:
        description: "Your Bluesky username, written in the .xlsx as 'Followed By' (empty = BSKY_IDENTIFIER secret)"
        required: false
        type: string
        default: ""
      resave:
        description: "Upload a fresh backup to Mega after a successful restore"
        required: false
        type: boolean
        default: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install chafa (screenshot preview in logs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chafa

      - name: Install openpyxl (for the follow .xlsx)
        run: pip install -q openpyxl || pip install -q --break-system-packages openpyxl

      - name: Download from Mega, restore, explore and follow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: restore
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          RESAVE: ${{ inputs.resave && '1' || '0' }}
          EXPLORE: ${{ inputs.explore && '1' || '0' }}
          HASHTAG: ${{ inputs.hashtag }}
          RESULTS_TAB: ${{ inputs.results_tab }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
          MIN_LIKES: ${{ inputs.min_likes }}
          FRESH_HOURS: ${{ inputs.fresh_hours }}
          SCAN_SCREENS: ${{ inputs.scan_screens }}
          FOLLOW_ENABLED: ${{ inputs.follow_enabled && '1' || '0' }}
          FOLLOW_COUNT: ${{ inputs.follow_count }}
          FOLLOW_ACCOUNT: ${{ inputs.follow_account }}
          FOLLOW_TZ: Asia/Karachi
          MEGA_FOLLOW_FILE: followed-users.xlsx
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          MEGA_DOWNLOAD: "1"
          MEGA_UPLOAD: "1"
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: bluesky-android-backup
          MEGA_FILE: ${{ inputs.backup_file }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash scripts/install-and-screenshot.sh

      - name: Upload screenshots, logs and follow .xlsx
        id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show artifact link
        if: always()
        run: |
          echo "Screenshots: ${{ steps.upload.outputs.artifact-url }}"
          {
            echo "### Restore screenshots"
            echo "[Download restore-screenshots](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
