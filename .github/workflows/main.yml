name: Run via my phone internet

on:
  workflow_dispatch:

env:
  PHONE_IP: 100.85.72.32

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Baseline IP and speed (no phone)
        run: |
          echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV
          head -c 10000000 /dev/urandom > /tmp/up.bin
          DOWN=$(curl -s -o /dev/null --max-time 60 -w '%{speed_download}' "https://speed.cloudflare.com/__down?bytes=25000000")
          echo "Baseline download: $(echo $DOWN | awk '{printf "%.2f", $1*8/1000000}') Mbps"

      - name: Show available exit nodes
        run: |
          tailscale status
          echo "---- exit nodes ----"
          tailscale exit-node list || true

      - name: Route traffic through my phone
        run: |
          sudo tailscale set --exit-node=$PHONE_IP --exit-node-allow-lan-access=true
          sleep 8
          tailscale status
          tailscale ping -c 4 $PHONE_IP || true

      - name: Verify IP changed
        run: |
          NEW_IP=$(curl -s --max-time 30 https://ifconfig.me)
          echo "Baseline IP: $BASELINE_IP"
          echo "Phone IP:    $NEW_IP"
          curl -s --max-time 20 "https://ipinfo.io/$NEW_IP/org" || true
          echo
          if [ -z "$NEW_IP" ] || [ "$NEW_IP" = "$BASELINE_IP" ]; then
            echo "ERROR: traffic is NOT going through the phone"
            exit 1
          fi

      - name: Speed test through my phone
        run: |
          DOWN=$(curl -s -o /dev/null --max-time 90 -w '%{speed_download}' "https://speed.cloudflare.com/__down?bytes=25000000")
          UP=$(curl -s -o /dev/null --max-time 90 -w '%{speed_upload}' -X POST --data-binary @/tmp/up.bin "https://speed.cloudflare.com/__up")
          LAT=$(curl -s -o /dev/null --max-time 20 -w '%{time_starttransfer}' "https://speed.cloudflare.com/__down?bytes=0")
          echo "Phone download: $(echo $DOWN | awk '{printf "%.2f", $1*8/1000000}') Mbps"
          echo "Phone upload:   $(echo $UP | awk '{printf "%.2f", $1*8/1000000}') Mbps"
          echo "Phone latency:  $(echo $LAT | awk '{printf "%.0f", $1*1000}') ms"

      - name: Your actual job
        run: |
          echo "Running through IP: $(curl -s --max-time 20 https://ifconfig.me)"
          curl -sI https://example.com | head -n 5
