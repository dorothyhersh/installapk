name: Android Install + Screenshots

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK"
        required: true
        type: string
        default: "https://github.com/bluesky-social/social-app/releases/download/1.136.0/Bluesky-1.136.0.apk"
      package_name:
        description: "Package name (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      spoof_device:
        description: "Spoof a random device identity (experimental, adds reboots)"
        required: false
        type: boolean
        default: false

jobs:
  install-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install chafa (screenshot preview in logs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chafa

      - name: Start emulator and run script
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SPOOF_DEVICE: ${{ inputs.spoof_device && '1' || '0' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics ${{ inputs.spoof_device && '-writable-system' || '' }}
          disable-animations: true
          script: bash scripts/install-and-screenshot.sh

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-output
          path: |
            artifacts/
            !artifacts/app.apk
          if-no-files-found: warn
          retention-days: 14
