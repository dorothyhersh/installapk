name: Android Install + Screenshots

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK (must be a direct .apk download link)"
        required: true
        type: string
      package_name:
        description: "Package name (leave empty for auto-detect)"
        required: false
        type: string
        default: ""
      spoof_device:
        description: "Try device spoofing (reboots emulator, may not work)"
        required: false
        type: boolean
        default: false

jobs:
  install-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare artifacts folder
        run: mkdir -p artifacts

      - name: Start emulator and run script
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SPOOF_DEVICE: ${{ inputs.spoof_device && '1' || '0' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/install-and-screenshot.sh

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: artifacts/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloaded-apk
          path: artifacts/app.apk
          if-no-files-found: ignore
          retention-days: 7
