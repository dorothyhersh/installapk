name: FB 1 - Login via phone internet and backup to Mega

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the APK/zip (leave empty to use the zip in Mega)"
        required: false
        type: string
      package_name:
        description: "Package name"
        required: false
        type: string
        default: "com.facebook.katana"

env:
  PHONE_IP: 100.85.72.32

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Record baseline IP (runner's own IP, before the phone)
        run: echo "BASELINE_IP=$(curl -s --max-time 20 https://ifconfig.me)" | tee -a $GITHUB_ENV

      # Download the zip BEFORE the emulator starts, on the runner internet (same IP as before the
      # phone). Doing it while the emulator boots can starve the runner of CPU and kill the job.
      - name: Download Facebook zip (runner internet, before emulator)
        env:
          BASELINE_IP: ${{ env.BASELINE_IP }}
          APK_URL: ${{ inputs.apk_url }}
          APK_MEGA_FILE: facebook-apk/facebook.zip
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: timeout 1000 bash scripts/download-apk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ORDER INSIDE THIS STEP:
      #  1) action installs SDK + boots emulator          -> runner internet (fast)
      #  2) (zip was already downloaded by the step before the emulator, runner internet)
      #  3) use-phone-exit-node.sh switches to the phone  -> from here on Telenor exit node IP
      #  4) facebook-install-and-login.sh installs the APK, launches Facebook and logs in
      #     -> all on the Telenor exit node IP (it also refuses to type credentials otherwise)
      - name: Start emulator, download zip, switch to phone IP, install and login
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHONE_IP: ${{ env.PHONE_IP }}
          BASELINE_IP: ${{ env.BASELINE_IP }}
          EXPECTED_PHONE_IP: ${{ secrets.EXPECTED_PHONE_IP }}
          MODE: login
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APK_MEGA_FILE: facebook-apk/facebook.zip
          MAKE_BACKUP: "1"
          FB_IDENTIFIER: ${{ secrets.FB_IDENTIFIER }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          FB_PAGE_NAME: ${{ secrets.FB_PAGE_NAME }}
          FB_REQUIRE_PAGE: "1"
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
          MEGA_FOLDER: facebook-android-backup
          MEGA_FILE: fb-session.tgz.enc
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            echo "[$(date -u +%T)] STEP 1 DONE: emulator is installed and fully booted"
            adb devices -l
            echo "[$(date -u +%T)] STEP 2: zip was downloaded earlier on the runner internet:"
            ls -l "$RUNNER_TEMP/fb.apk"
            echo "[$(date -u +%T)] STEP 3: switching to the phone (Telenor) exit node"
            timeout 300 bash scripts/use-phone-exit-node.sh
            echo "[$(date -u +%T)] public IP now: $(curl -s --max-time 30 https://ifconfig.me)"
            echo "[$(date -u +%T)] STEP 4: install APK, launch Facebook and login on the phone IP"
            bash scripts/facebook-install-and-login.sh
            echo "[$(date -u +%T)] ALL DONE"

      - name: Print all logs
        if: always()
        run: |
          echo "=== tailscale status ==="; tailscale status || true
          echo "=== public IP now ==="; curl -s --max-time 20 https://ifconfig.me || true; echo
          echo "=== run.log (everything the Facebook script did) ==="; cat artifacts/run.log 2>/dev/null || echo "no run.log (script never started)"
          echo "=== artifacts ==="; ls -la artifacts/ 2>/dev/null || echo "no artifacts folder"
          echo "=== logcat (last 200 lines) ==="; tail -n 200 artifacts/logcat.txt 2>/dev/null || echo "no logcat"

      - name: Upload screenshots and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-login-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
