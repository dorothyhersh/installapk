name: FB - Restore FULL emulator backup + launch Facebook

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CACHE_PREFIX: emu-fb-api30-

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore emulator backup from cache (fast path)
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}none
          restore-keys: ${{ env.CACHE_PREFIX }}
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-30

      - name: Cache missing -> restore from artifact copy
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fb-emulator-build.yml --status success --limit 5 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "No successful build run found - run the build workflow first"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n emulator-backup -D "$RUNNER_TEMP/emu"
          zstd -d -T0 -c "$RUNNER_TEMP/emu/avd.tar.zst" | tar -C "$HOME" -xf -

      - name: Verify backup is present
        run: |
          ls -la ~/.android/avd/fb-base.avd/snapshots/ 
          test -d ~/.android/avd/fb-base.avd/snapshots/fb_ready

      - name: Boot from snapshot + launch Facebook
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE_NAME: com.facebook.katana
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: fb-base
          cores: 2
          ram-size: 3072M
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -snapshot fb_ready -no-snapshot-save
          disable-animations: false
          script: bash emulatorscripts/launch-facebook.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-launch
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
